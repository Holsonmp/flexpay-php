name: FlexPay package quality

on:
  push:
    paths:
      - 'packages/flexpay-php/**'
      - 'app/Services/Payments/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/flexpay-package.yml'
  pull_request:
    paths:
      - 'packages/flexpay-php/**'
      - 'app/Services/Payments/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/flexpay-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
      - working-directory: packages/flexpay-php
        run: composer validate --strict
      - working-directory: packages/flexpay-php
        run: composer install --no-interaction --prefer-dist
      - working-directory: packages/flexpay-php
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text
      - working-directory: packages/flexpay-php
        run: php scripts/check-coverage.php coverage.xml 85
      - working-directory: packages/flexpay-php
        run: vendor/bin/phpstan analyse src tests
      - working-directory: packages/flexpay-php
        run: vendor/bin/phpcs --standard=PSR12 src tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: packages/flexpay-php
        run: npm ci
      - working-directory: packages/flexpay-php
        run: npm test
      - working-directory: packages/flexpay-php
        run: npm run build
      - run: git diff --exit-code -- packages/flexpay-php/dist

  host-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
