name: Release validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: xdebug
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: composer release:check
      - run: composer coverage
      - run: composer archive --format=tar --file=flexpay-php-candidate
      - run: tar -tf flexpay-php-candidate.tar
      - name: Confirm validation-only workflow
        run: echo "Aucune publication, release ou transaction n’est exécutée par ce workflow."
